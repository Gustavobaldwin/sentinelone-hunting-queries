name: validate-queries
on: {push: {paths: ["queries/**", "schema/**", "scripts/**", "README.md"]}, pull_request: {}, workflow_dispatch: {}}
jobs: {validate: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: "3.12"}}, {run: pip install pyyaml jsonschema}, {run: python scripts/validate.py}]}}
